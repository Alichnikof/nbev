[project]
name = "nbev"
version = "0.1.0"
description = "Order-invariant multiple-choice decisions with a bidirectional encoder (DeBERTa-v3), calibrated per task"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.0.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "openai>=3.59.0",
    "peft>=0.21.0",
    "protobuf>=7.36.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentencepiece>=0.2.3",
    "torch>=2.14.0",
    "torchinfo>=1.8.0",
    "torchview>=0.2.7",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
