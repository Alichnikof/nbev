# Long run: nbev on ALL the multiple-choice training questions (~98K after the held-out splits), one epoch.
#   caffeinate -i uv run python train.py configs/choice_full.yaml --name nbev-choice-full
# (caffeinate -i keeps the Mac awake while the run lasts.) Same model and settings as choice_walkthrough.yaml,
# except the data size and a sparser, larger validation: all ~2,000 validation questions every 500 steps.
seed: 0

model:
  architecture: nbev            # "[CLS] question+state [SEP] [OPT] A [SEP] [OPT] B [SEP] ..." per question
  name: microsoft/deberta-v3-base
  num_layers: null              # all 12 layers
  pooling: opt                  # choice vector = output of its [OPT] token (alternatives: mean, opt_mean)
  full_finetune: true

data:
  task_types: [choice]          # only multiple-choice questions (null or absent = all three types)
  max_train_questions: null     # all of them
  max_test_questions: null      # all ~2,000 held-out validation questions, to pick the best checkpoint
  eval_split: validation        # calibration and test splits stay untouched during training
  max_state_tokens: 448         # long states keep their first 64 tokens and their end (the response being judged)
  max_choice_tokens: 64
  batch_size: 8                 # questions per micro-batch (one sequence each)
  num_workers: 0
  group_by_length: true         # batches of similar length: less padding

lora:
  last_k_layers: 0              # unused: full_finetune trains everything
  r: 8
  alpha: 16
  dropout: 0.0

head:
  type: candidate_mlp           # ours: self-attention between candidates, then the same MLP scores each one
  new_dim: 512
  num_layers: 2

optim:
  epochs: 1
  lr_backbone: 3.0e-5           # small: DeBERTa is pretrained
  lr_head: 1.0e-3               # large: the head starts from random weights
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 1.0
  grad_accum_steps: 2           # 8 x 2 = 16 questions per optimizer step

logging:
  log_every: 10                 # optimizer steps (train lines average everything since the previous line)
  eval_every: 500               # evaluate on validation, keep the best checkpoint
  save_every: 500               # checkpoints/latest (~2.2 GB with optimizer state, overwritten): --continue_run after a crash
  select_by: loss               # best checkpoint = lowest validation NLL (we use the probabilities)
